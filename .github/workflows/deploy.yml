name: Build & Publish RSS

on:
  schedule:
    - cron: "0 0 * * *" # Daily
  workflow_dispatch: # Allow manual runs

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: 🗑 Delete deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DEPLOYMENT_IDS=$(gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=100" \
            --jq '.[].id')
          for ID in $DEPLOYMENT_IDS; do
            gh api --method POST "/repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
              -f state=inactive --silent
            gh api --method DELETE "/repos/$GITHUB_REPOSITORY/deployments/$ID" --silent
          done

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "stable"
      - run: go run cmd/rss-builder/main.go
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./output

  deploy:
    needs: [build, cleanup]

    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
